<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Result - Quiz Platform</title>
  <!-- Local CSS -->
  <link rel="stylesheet" href="css/tailwind.css">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="min-h-screen bg-slate-50 flex flex-col">

  <!-- Header -->
  <div id="header-container"></div>

  <!-- Main Content -->
  <main class="flex-1 flex flex-col justify-center items-center px-4 py-8">
    <div class="max-w-3xl w-full animate-slide-up space-y-8">

      <!-- Success Check Circle Icon & Header -->
      <div class="text-center">
        <div class="flex justify-center mb-4">
          <span class="inline-flex items-center justify-center p-4 bg-emerald-50 rounded-2xl text-emerald-600 border border-emerald-100 shadow-sm animate-bounce">
            <i data-lucide="check-circle-2" class="w-10 h-10"></i>
          </span>
        </div>

        <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">Quiz Submitted!</h1>
        <p class="mt-2 text-slate-600 text-sm" id="congrats-text">
          Congratulations, your responses have been registered.
        </p>
      </div>

      <!-- Centered White Quiz Result Card -->
      <div class="bg-white border border-slate-200 shadow-md rounded-2xl p-6 sm:p-8 text-center max-w-md mx-auto">
        <span class="text-[10px] font-bold text-blue-600 bg-blue-50 px-2.5 py-1 rounded-full uppercase tracking-wider">
          Performance Summary
        </span>

        <h2 class="text-lg font-bold text-slate-800 mt-4 mb-1 line-clamp-2" id="quiz-title-display">
          Quiz
        </h2>

        <!-- Score circle -->
        <div class="my-6 flex flex-col items-center justify-center">
          <div class="w-32 h-32 rounded-full border-4 border-slate-100 flex flex-col items-center justify-center bg-slate-50 shadow-inner relative animate-bounce-in">
            <span class="text-3xl font-black text-slate-900" id="score-display">0</span>
            <span class="text-xs font-semibold text-slate-400 mt-0.5 border-t border-slate-200 w-10 pt-0.5 text-center" id="total-display">out of 0</span>
          </div>
        </div>

        <!-- Percentage Bar & Info -->
        <div class="space-y-4 mb-6">
          <div>
            <div class="flex justify-between items-center text-xs font-bold text-slate-600 mb-1">
              <span>Overall Score</span>
              <span id="pct-display">0%</span>
            </div>
            <div class="w-full bg-slate-100 rounded-full h-2">
              <div
                id="pct-bar"
                class="h-full rounded-full transition-all duration-1000"
                style="width: 0%"
              ></div>
            </div>
          </div>
          
          <p class="text-xs text-slate-500 font-medium" id="feedback-text">
            Keep studying! Practice makes perfect.
          </p>
        </div>

        <div class="space-y-3">
          <button
            id="toggle-review-btn"
            type="button"
            class="w-full flex items-center justify-center gap-2 py-3 px-4 bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white font-semibold text-sm rounded-xl transition shadow-sm cursor-pointer shadow-emerald-100"
          >
            <i data-lucide="list-checks" class="w-4 h-4"></i>
            <span id="toggle-review-btn-text">Review Questions & Answers</span>
          </button>

          <button
            id="return-btn"
            class="w-full flex items-center justify-center gap-1.5 py-3 px-4 border border-slate-200 rounded-xl shadow-sm text-sm font-semibold text-slate-700 bg-white hover:bg-slate-50 transition cursor-pointer"
          >
            <i data-lucide="refresh-cw" class="w-4 h-4 text-slate-500"></i>
            Take Another Quiz
          </button>
        </div>
      </div>

      <!-- Detailed Question Review Section (Hidden by default until Review button clicked) -->
      <div id="review-section" class="hidden bg-white border border-slate-200 shadow-md rounded-2xl p-6 sm:p-8 space-y-6">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-slate-100 pb-5">
          <div>
            <h3 class="text-xl font-extrabold text-slate-900 flex items-center gap-2">
              <i data-lucide="list-checks" class="w-6 h-6 text-blue-600"></i>
              Question Review
            </h3>
            <p class="text-xs text-slate-500 mt-1">Review all your answers, correct responses, and status.</p>
          </div>

          <!-- Filter Pills -->
          <div class="flex items-center gap-1.5 bg-slate-100 p-1 rounded-xl shrink-0 self-start sm:self-auto">
            <button
              id="filter-all-btn"
              type="button"
              class="px-3 py-1.5 rounded-lg text-xs font-bold transition bg-white text-blue-600 shadow-sm cursor-pointer"
            >
              All (<span id="stat-total-cnt">0</span>)
            </button>
            <button
              id="filter-correct-btn"
              type="button"
              class="px-3 py-1.5 rounded-lg text-xs font-bold transition text-slate-600 hover:text-emerald-600 cursor-pointer"
            >
              Correct (<span id="stat-correct-cnt">0</span>)
            </button>
            <button
              id="filter-incorrect-btn"
              type="button"
              class="px-3 py-1.5 rounded-lg text-xs font-bold transition text-slate-600 hover:text-rose-600 cursor-pointer"
            >
              Incorrect (<span id="stat-incorrect-cnt">0</span>)
            </button>
          </div>
        </div>

        <!-- Questions List Container -->
        <div id="review-questions-list" class="space-y-6">
          <!-- Dynamically populated by js/result.js -->
        </div>
      </div>

    </div>
  </main>

  <!-- Local vendor JS -->
  <script src="public/vendor/supabase.js"></script>
  <script src="public/vendor/lucide.min.js"></script>
  <script src="config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/result.js"></script>
</body>
</html>
